encoder:
  desc: EL7062 touch-probe index fixture
  unit: mm
  numerator: 1
  denominator: 4096
  type: 0
  bits: 32
  absBits: 0
  position: ec0.s$(ENC_SID).positionActual$(ENC_CH=01)_2
  status: ec0.s$(ENC_SID).touchProbeStatus$(ENC_CH=01)
  control: ec0.s$(ENC_SID).touchProbeControl$(ENC_CH=01)
  latch:
    position: ec0.s$(ENC_SID).touchProbePositionPos$(ENC_CH=01)_1
    control: 0
    status: 1
    armCmd: 17
    armBits: 5
  homing:
    type: 11
    position: 0
    velocity:
      to: 0.2
      from: 0.1
    acceleration: 1
    deceleration: 1
    latchCount: 1
    timeout: 12

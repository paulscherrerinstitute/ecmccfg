axis:
  id: ${AX_ID}
  group: virtualAxes
  type: end effector
  #parameters: 'powerAutoOnOff=0;powerOnDelay=1.0;powerOffDelay=2.0;'
  autoEnable:
    enableTimeout: 5.0
    disableTimeout: 3.0

epics:
  name: CENTERY
  precision: 4
  unit: mm
  motorRecord:
    pvt:
      npoints: 64
      nreadback: 256
    description: "Center (Virtual)"
    fieldInit: "SPAM=0,RTRY=1,FOFF=Frozen,TWV=1"

encoder:
  type: 1
  source: 1
  numerator: 1
  bits: 32

trajectory:
  axis:
    velocity: 1
    acceleration: 1
    jerk: 5

input:
  limit:
    forward: ec${M_ID=0}.s-1.ONE.0              # unused
    backward: ec${M_ID=0}.s-1.ONE.0             # unused
  home: ec${M_ID=0}.s-1.ONE.0                   # unused
  interlock: ec${M_ID=0}.s-1.ONE.0              # unused

#softlimits:
#  enable: false
#  forwardEnable: true
#  backwardEnable: true
#  forward: 52
#  backward: 8

monitoring:
  lag:
    enable: yes
    # Physical blade monitors use 0.04 mm; leave margin for group propagation.
    tolerance: 0.08
    time: 100
  target:
    enable: yes
    tolerance: 0.02
    time: 100
    slaveControlDeadband:
      tolerance: 0.005
      # Longer than AtTarget so SIM can observe the independent dwell.
      time: 600
  velocity:
    enable: yes
    max: 2
    time:
      trajectory: 100
      drive: 100

plc:
  enable: true
  externalCommands: true
  velocity_filter:
    encoder:
      enable: false
      size: 10
    trajectory:
      enable: false
      size: 10
